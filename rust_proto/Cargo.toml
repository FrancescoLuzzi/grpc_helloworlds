[package]
name = "rust_proto"
version = "0.1.0"
edition = "2021"

[features]
dockerproto = []

[dependencies]
argh = "0.1"
axum = "0.8"
prost = "0.13"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "tokio-macros"] }
tonic = { version = "0.13", features = [ "gzip"] }
tonic-web = "0.13"
tonic-reflection = "0.13"
log = "0.4.22"
env_logger = "0.11.5"

[build-dependencies]
tonic-build = "0.13"
